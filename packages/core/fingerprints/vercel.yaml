id: vercel
name: Vercel
category: hosting
website: https://vercel.com
rules:
  - id: header-x-vercel-id
    layer: http
    signal: header
    key: x-vercel-id
    match: { exists: true }
    weight: 0.95
    detail: Vercel request id header

  - id: header-x-vercel-cache
    layer: http
    signal: header
    key: x-vercel-cache
    match: { exists: true }
    weight: 0.9
    detail: Vercel edge cache header

  - id: header-server
    layer: http
    signal: header
    key: server
    match: { equals: Vercel }
    weight: 0.9

  # Vercel Web Analytics and Speed Insights are served from the deployment itself.
  - id: insights-script
    layer: http
    signal: script-src
    match: { regex: '/_vercel/(?:insights|speed-insights)/' }
    weight: 0.85
    detail: Vercel analytics script

  - id: insights-request
    layer: browser
    signal: request-url
    match: { regex: '/_vercel/(?:insights|speed-insights)/' }
    weight: 0.85
    detail: Vercel analytics request

  - id: dns-cname
    layer: dns
    signal: cname
    match: { regex: '\.vercel-dns(?:-\d+)?\.com\.?$' }
    weight: 0.9
    detail: CNAME to Vercel

  # Every IPv4 network registered to Vercel, Inc. at ARIN (VERCEL-01 to VERCEL-14), checked
  # 2026-10-02. Vercel's own sites use the newer ranges, not just the 76.76.21.0/24 anycast.
  # These networks are announced from Amazon's AS16509, so the ASN alone says nothing.
  - id: dns-a-vercel-network
    layer: dns
    signal: a
    match:
      cidr:
        - 76.76.21.0/24
        - 66.33.60.0/24
        - 198.169.1.0/24
        - 198.169.2.0/24
        - 216.198.79.0/24
        - 216.230.84.0/24
        - 216.230.86.0/24
        - 216.150.16.0/24
        - 216.150.1.0/24
        - 64.239.123.0/24
        - 64.239.109.0/24
        - 64.29.17.0/24
        - 143.13.0.0/16
        - 155.121.0.0/16
    weight: 0.85
    detail: A record in a network registered to Vercel

  # DNS hosted at Vercel says little about where the site itself runs.
  - id: dns-ns
    layer: dns
    signal: ns
    match: { regex: '\.vercel-dns\.com\.?$' }
    weight: 0.4
    detail: Nameservers at Vercel
