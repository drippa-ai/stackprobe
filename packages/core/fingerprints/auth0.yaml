id: auth0
name: Auth0
category: auth
website: https://auth0.com
rules:
  # Apps that sign in on the server redirect straight to the tenant's login.
  - id: redirect-to-login
    layer: http
    signal: header
    key: location
    match: { regex: '^https://[a-z0-9-]+(?:\.[a-z]{2})?\.auth0\.com/(?:authorize|u/login)' }
    weight: 0.95
    detail: Redirect to an Auth0 login

  - id: cdn-script
    layer: http
    signal: script-src
    match: { prefix: 'https://cdn.auth0.com/' }
    weight: 0.85
    detail: Script from Auth0's CDN

  - id: preconnect
    layer: http
    signal: link-href
    match: { regex: '^https://[a-z0-9-]+(?:\.[a-z]{2})?\.auth0\.com' }
    weight: 0.8
    detail: Preconnect to an Auth0 tenant

  - id: tenant-request
    layer: browser
    signal: request-url
    match: { regex: '^https://[a-z0-9-]+(?:\.[a-z]{2})?\.auth0\.com/(?:authorize|oauth/token|u/login|co/authenticate)' }
    weight: 0.95
    detail: Request to an Auth0 tenant

  # Set by auth0-spa-js.
  - id: spa-cookie
    layer: browser
    signal: cookie-name
    match: { regex: '^auth0\.[A-Za-z0-9]+\.is\.authenticated$' }
    weight: 0.9
    detail: auth0-spa-js session cookie

  # A tenant address in the page's own JavaScript (not Auth0's CDN or its website).
  - id: bundle-tenant
    layer: bundle
    signal: bundle-url
    match: { regex: '^https://(?!cdn\.|www\.)[a-z0-9-]+(?:\.[a-z]{2})?\.auth0\.com$' }
    weight: 0.85
    detail: Auth0 tenant address in the page's own JavaScript

  - id: bundle-spa-sdk
    layer: bundle
    signal: bundle-sdk
    match: { regex: '^auth0-spa-js/(\d+\.\d+\.\d+)' }
    version: $1
    weight: 0.9
    detail: auth0-spa-js bundled with the page
